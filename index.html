<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маскот Столото</title>
<style>
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/m-cyr-500.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/m-lat-500.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/m-cyr-600.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/m-lat-600.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/m-cyr-700.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/m-lat-700.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 800; font-display: swap; src: url("fonts/m-cyr-800.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 800; font-display: swap; src: url("fonts/m-lat-800.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Montserrat Alternates"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/a-cyr-700.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Montserrat Alternates"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/a-lat-700.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Montserrat Alternates"; font-style: normal; font-weight: 800; font-display: swap; src: url("fonts/a-cyr-800.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Montserrat Alternates"; font-style: normal; font-weight: 800; font-display: swap; src: url("fonts/a-lat-800.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

:root {
  --ink: #2a2112;
  --muted: #6e5c3c;
  --paper: #fffdf6;
  --line: #ead9a0;
  --gold: #f5b800;
  --gold-deep: #e09a00;
  --chip: #fff4c2;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  color: var(--ink);
  font: 16px/1.45 Montserrat, "Segoe UI", sans-serif;
  background:
    radial-gradient(900px 420px at 0% -10%, #fff6bf, transparent 60%),
    linear-gradient(165deg, #fff4c2 0%, #ffe56a 48%, #ffd24a 100%);
}
button, input, a { font: inherit; }
.wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
header.top {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
  padding: 28px 0 18px;
}
.logo { height: 48px; width: auto; display: block; }
.title-row {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
h1 {
  margin: 0;
  font-family: "Montserrat Alternates", Montserrat, sans-serif;
  font-weight: 800;
  font-size: clamp(34px, 5vw, 52px);
  letter-spacing: -.04em;
  line-height: .95;
}
.disk {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  text-decoration: none;
  color: #1c1c1c;
  background: linear-gradient(90deg, #b6ef4a 0%, #d4ff55 48%, #e9ff86 100%);
  border: 0;
  border-radius: 18px;
  padding: 14px 28px;
  font-weight: 700;
  letter-spacing: -.02em;
  box-shadow: none;
  cursor: pointer;
}
.disk:hover { filter: brightness(1.04); }
.bar {
  position: sticky;
  top: 0;
  z-index: 5;
  padding: 12px 0 14px;
  background: transparent;
}
.bar-row { display: flex; gap: 10px; align-items: center; }
.search {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  border-radius: 999px;
  padding: 12px 16px;
  font-weight: 600;
  outline: none;
}
.search:focus { border-color: var(--gold-deep); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip {
  border: 1px solid transparent;
  background: rgba(255, 253, 246, .72);
  color: var(--ink);
  border-radius: 999px;
  padding: 8px 14px;
  font-weight: 700;
  cursor: pointer;
}
.chip[aria-pressed="true"] {
  background: #ffe14a;
  color: var(--ink);
  box-shadow: inset 0 0 0 2px #f5b800;
}
.count { margin: 4px 0 0; color: var(--muted); font-weight: 600; font-size: 14px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  padding-bottom: 48px;
}
.card {
  background: var(--paper);
  border-radius: 22px;
  padding: 10px 10px 14px;
  box-shadow: 0 12px 28px rgba(120, 78, 0, .10);
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.stage {
  aspect-ratio: 1;
  width: 100%;
  border: 0;
  border-radius: 22px;
  padding: 12%;
  cursor: zoom-in;
  background: #fffdf8;
  box-shadow:
    0 0 0 3px #8ecfff,
    0 0 0 7px #fffdf8,
    0 0 0 10px #5eb6f5;
  display: grid;
  place-items: center;
}
.stage img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.card h2 {
  margin: 0;
  padding: 0 6px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.25;
}
.tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 6px; min-height: 26px; }
.tag {
  border: 0;
  background: #fff1b8;
  color: var(--ink);
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dl, .copy {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: none;
  border: 0;
  border-radius: 12px;
  min-height: 42px;
  padding: 0 8px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  color: var(--ink);
}
.dl { background: var(--gold); }
.dl:hover { background: #ffd24a; }
.copy { background: #e7f6ff; }
.copy:hover { background: #d4efff; }
.dl svg, .copy svg { display: block; flex: none; }
.open {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  border-radius: 12px;
  background: #e7f6ff;
  color: var(--ink);
  font-weight: 700;
  text-decoration: none;
}
.empty {
  grid-column: 1 / -1;
  background: rgba(255, 253, 246, .78);
  border-radius: 22px;
  padding: 36px 28px;
  text-align: center;
}
.empty strong { display: block; font-family: "Montserrat Alternates", Montserrat, sans-serif; font-size: 28px; letter-spacing: -.03em; margin-bottom: 8px; }
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(42, 33, 18, .72);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.lightbox.open { display: flex; }
.sheet {
  width: min(920px, 100%);
  background: var(--paper);
  border-radius: 28px;
  padding: 16px;
  display: grid;
  grid-template-columns: 1.3fr .8fr;
  gap: 16px;
}
.preview {
  aspect-ratio: 1;
  border-radius: 22px;
  background: #fffdf8;
  box-shadow:
    0 0 0 3px #8ecfff,
    0 0 0 7px #fffdf8,
    0 0 0 10px #5eb6f5;
  display: grid;
  place-items: center;
  padding: 8%;
}
.preview img { width: 100%; height: 100%; object-fit: contain; }
.side { display: flex; flex-direction: column; gap: 12px; padding: 8px 8px 8px 0; }
.side h2 { margin: 0; font-family: "Montserrat Alternates", Montserrat, sans-serif; font-size: 32px; letter-spacing: -.04em; line-height: 1; }
.side p { margin: 0; color: var(--muted); font-weight: 500; }
.side .actions { grid-template-columns: 1fr; margin-top: auto; }
.ghost {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-weight: 700;
  cursor: pointer;
  text-align: left;
  padding: 0;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  background: #2a2112;
  color: #fff8d8;
  border-radius: 999px;
  padding: 12px 16px;
  font-weight: 700;
  display: none;
  z-index: 30;
}
@media (max-width: 760px) {
  .title-row { align-items: flex-start; flex-direction: column; }
  .sheet { grid-template-columns: 1fr; }
  .side { padding: 0 4px 4px; }
  .side h2 { font-size: 26px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img class="logo" src="stoloto-logo.png" alt="Столото">
    <div class="title-row">
      <h1>Маскот</h1>
      <a class="disk" id="disk" href="#" target="_blank" rel="noopener">Яндекс Диск</a>
    </div>
  </header>
  <div class="bar">
    <div class="bar-row">
      <input class="search" id="q" type="search" placeholder="Найти: Новый год, МТС, адвент" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
    <p class="count" id="count"></p>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="lightbox" id="box" role="dialog" aria-modal="true" aria-labelledby="boxTitle">
  <div class="sheet">
    <div class="preview"><img id="boxImg" alt=""></div>
    <div class="side">
      <h2 id="boxTitle"></h2>
      <p id="boxTags"></p>
      <p>Файл откроется в исходном размере. Прозрачный фон сохранится.</p>
      <div class="actions">
        <a class="dl" id="boxDl" href="#" download>Скачать PNG</a>
        <button class="dl" id="boxCopy" type="button" style="background:#fff4c2">Скопировать картинку</button>
        <a class="open" id="boxOpen" href="#" target="_blank" rel="noopener" style="width:auto">Открыть файл</a>
      </div>
      <button class="ghost" id="boxClose" type="button">Закрыть</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const SAFE = /^files\/[A-Za-z0-9._-]+\.png$/;
let catalog = { disk: "", tags: [], items: [] };
let active = "Все";

function safeFile(file) {
  return SAFE.test(file) ? file : "";
}
function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.style.display = "none"; }, 2400);
}
function visible() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  return catalog.items.filter(item => {
    const tags = item.tags || [];
    const byTag = active === "Все" || tags.includes(active);
    const hay = (item.title + " " + tags.join(" ")).toLowerCase();
    return byTag && (!q || hay.includes(q));
  });
}
function renderChips() {
  const host = document.getElementById("chips");
  const names = ["Все", ...catalog.tags];
  host.replaceChildren();
  names.forEach(name => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = name === "Все" ? "Все" : "#" + name;
    b.setAttribute("aria-pressed", String(name === active));
    b.addEventListener("click", () => {
      active = name;
      if (name === "Все") history.replaceState(null, "", location.pathname);
      else history.replaceState(null, "", "#" + encodeURIComponent(name));
      render();
    });
    host.appendChild(b);
  });
}
function iconDownload() {
  return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.5a.75.75 0 0 1 .75.75v6.19l1.72-1.72a.75.75 0 1 1 1.06 1.06l-3 3a.75.75 0 0 1-1.06 0l-3-3a.75.75 0 1 1 1.06-1.06l1.72 1.72V2.25A.75.75 0 0 1 8 1.5ZM3 11.25a.75.75 0 0 1 .75.75v.5c0 .41.34.75.75.75h7a.75.75 0 0 0 .75-.75v-.5a.75.75 0 0 1 1.5 0v.5A2.25 2.25 0 0 1 11.5 15h-7A2.25 2.25 0 0 1 2.25 12.5v-.5a.75.75 0 0 1 .75-.75Z"/></svg>';
}
function iconCopy() {
  return '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M5.5 2A1.5 1.5 0 0 0 4 3.5V11a1.5 1.5 0 0 0 1.5 1.5h6A1.5 1.5 0 0 0 13 11V3.5A1.5 1.5 0 0 0 11.5 2h-6ZM5.5 3.5h6V11h-6V3.5ZM3 5a.75.75 0 0 0-1.5 0v7A2.5 2.5 0 0 0 4 14.5h6a.75.75 0 0 0 0-1.5H4A1 1 0 0 1 3 12V5Z"/></svg>';
}
async function copyPng(file) {
  try {
    const res = await fetch(file);
    const buf = await res.arrayBuffer();
    const png = new Blob([buf], { type: "image/png" });
    await navigator.clipboard.write([new ClipboardItem({ "image/png": png })]);
    toast("Картинка скопирована");
  } catch (err) {
    toast("Скопируйте её правой кнопкой мыши");
  }
}
function card(item) {
  const file = safeFile(item.file);
  const art = document.createElement("article");
  art.className = "card";
  const stage = document.createElement("button");
  stage.type = "button";
  stage.className = "stage";
  stage.setAttribute("aria-label", "Открыть: " + item.title);
  const img = document.createElement("img");
  img.alt = item.title;
  img.src = file;
  stage.append(img);
  stage.addEventListener("click", () => openBox(item));
  const h = document.createElement("h2");
  h.textContent = item.title;
  const tags = document.createElement("div");
  tags.className = "tags";
  (item.tags || []).forEach(tag => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tag";
    b.textContent = "#" + tag;
    b.addEventListener("click", () => {
      active = tag;
      history.replaceState(null, "", "#" + encodeURIComponent(tag));
      render();
    });
    tags.append(b);
  });
  const actions = document.createElement("div");
  actions.className = "actions";
  const dl = document.createElement("a");
  dl.className = "dl";
  dl.href = file;
  dl.setAttribute("download", (item.download || item.title) + ".png");
  dl.innerHTML = iconDownload() + "Скачать";
  const copy = document.createElement("button");
  copy.type = "button";
  copy.className = "copy";
  copy.innerHTML = iconCopy() + "Копировать";
  copy.addEventListener("click", () => copyPng(file));
  actions.append(dl, copy);
  art.append(stage, h, tags, actions);
  return art;
}
function render() {
  renderChips();
  const items = visible();
  const grid = document.getElementById("grid");
  const count = document.getElementById("count");
  grid.replaceChildren();
  if (!catalog.items.length) {
    count.textContent = "Картинки появятся в этой палитре";
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = "<strong>Маскот ещё собирается</strong><span>Палитра уже на месте. Как только PNG будут готовы, каждый шарик встанет в свою карточку одного размера.</span>";
    grid.append(empty);
    return;
  }
  count.textContent = items.length + " из " + catalog.items.length;
  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = "<strong>Такого шарика пока нет</strong><span>Снимите фильтр или посмотрите соседнее состояние.</span>";
    grid.append(empty);
    return;
  }
  items.forEach(item => grid.append(card(item)));
}
function openBox(item) {
  const file = safeFile(item.file);
  document.getElementById("boxImg").src = file;
  document.getElementById("boxImg").alt = item.title;
  document.getElementById("boxTitle").textContent = item.title;
  document.getElementById("boxTags").textContent = (item.tags || []).map(t => "#" + t).join("  ");
  const dl = document.getElementById("boxDl");
  dl.href = file;
  dl.setAttribute("download", (item.download || item.title) + ".png");
  document.getElementById("boxOpen").href = file;
  document.getElementById("box").classList.add("open");
  document.getElementById("box").dataset.file = file;
}
document.getElementById("boxClose").addEventListener("click", () => {
  document.getElementById("box").classList.remove("open");
});
document.getElementById("box").addEventListener("click", (e) => {
  if (e.target.id === "box") document.getElementById("box").classList.remove("open");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.getElementById("box").classList.remove("open");
});
document.getElementById("boxCopy").addEventListener("click", () => {
  copyPng(document.getElementById("box").dataset.file);
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("disk").addEventListener("click", (e) => {
  if (!catalog.disk) {
    e.preventDefault();
    toast("Ссылку на папку Диска добавим сюда");
  }
});

fetch("catalog.json")
  .then(r => r.json())
  .then(data => {
    catalog = data;
    const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (hash && catalog.tags.includes(hash)) active = hash;
    const disk = document.getElementById("disk");
    if (catalog.disk) disk.href = catalog.disk;
    render();
  })
  .catch(() => {
    document.getElementById("count").textContent = "Не удалось открыть список маскотов";
  });
</script>
</body>
</html>
